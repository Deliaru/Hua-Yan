<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e6e73"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0071e3"/>
    </marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#1d1d1f}
      .s{font-size:14px;font-weight:400;fill:#6e6e73}
      .l{font-size:13px;font-weight:400;fill:#6e6e73}
      .card{fill:#f5f5f7;stroke:#d2d2d7;stroke-width:1}
      .core{fill:#eef5fd;stroke:#0071e3;stroke-width:2}
      .white{fill:#ffffff;stroke:#d2d2d7;stroke-width:1}
      .flow{stroke:#6e6e73;stroke-width:1.6;fill:none}
      .feed{stroke:#0071e3;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#f5f5f7"/>

  <text x="800" y="52" text-anchor="middle" style="font-size:30px;font-weight:600;fill:#1d1d1f">化言｜组织智能运行架构</text>
  <text x="800" y="84" text-anchor="middle" style="font-size:17px;fill:#6e6e73">以组织级 Agent Harness 重构企业的决策、协作与能力积累</text>

  <!-- 人 -->
  <rect x="120" y="108" width="1360" height="64" rx="14" class="white"/>
  <text x="800" y="137" text-anchor="middle" class="t">人确定组织目标与专业责任</text>
  <text x="800" y="160" text-anchor="middle" class="s">设定目标与约束 · 作出技术和商业取舍 · 确认专业结论、授予能力 · 随时主动委托与决定</text>
  <line x1="800" y1="172" x2="800" y2="208" class="flow" marker-end="url(#a)"/>

  <!-- Harness 外框 -->
  <rect x="260" y="210" width="1080" height="660" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/>
  <text x="290" y="246" style="font-size:20px;font-weight:600;fill:#1d1d1f">组织级 Agent Harness</text>
  <text x="1310" y="246" text-anchor="end" class="s">由业务对象、事件流、问题总线、hub、角色 Agent、门面与工作面共同承担</text>

  <!-- 业务对象与持续状态 -->
  <rect x="290" y="266" width="1020" height="66" rx="12" class="card"/>
  <text x="314" y="305" class="t">业务对象与持续状态</text>
  <text x="1286" y="305" text-anchor="end" class="s">共同目标 · 事实与原话 · 未知项 · 未决事项 · 依赖与进展 · 能力与授权 · 行动结果</text>

  <!-- 业务信息 -->
  <rect x="40" y="266" width="190" height="290" rx="14" class="white"/>
  <text x="135" y="302" text-anchor="middle" class="t">业务信息</text>
  <text x="135" y="340" text-anchor="middle" class="s">客户对话与反馈</text>
  <text x="135" y="368" text-anchor="middle" class="s">需求与业务进展</text>
  <text x="135" y="396" text-anchor="middle" class="s">试样与客户评价</text>
  <text x="135" y="424" text-anchor="middle" class="s">资料来源变更</text>
  <text x="135" y="452" text-anchor="middle" class="s">系统事件</text>
  <line x1="230" y1="299" x2="288" y2="299" class="flow" marker-end="url(#a)"/>

  <!-- 运行循环 -->
  <line x1="380" y1="332" x2="380" y2="378" class="flow" marker-end="url(#a)"/>
  <rect x="290" y="380" width="180" height="160" rx="12" class="core"/>
  <text x="380" y="416" text-anchor="middle" class="t">觉</text>
  <text x="380" y="444" text-anchor="middle" class="s">形成 · 维持 · 筛选 · 提交</text>
  <text x="380" y="468" text-anchor="middle" class="s">决策目录 × 业务对象</text>
  <text x="380" y="492" text-anchor="middle" class="s">规则冷启动，Jue-K 学习</text>
  <text x="380" y="516" text-anchor="middle" class="s">不调用大模型</text>

  <line x1="470" y1="460" x2="498" y2="460" class="flow" marker-end="url(#a)"/>
  <rect x="500" y="380" width="180" height="160" rx="12" class="card"/>
  <text x="590" y="416" text-anchor="middle" class="t">问题总线 · 派单</text>
  <text x="590" y="444" text-anchor="middle" class="s">事项、主人、签字人</text>
  <text x="590" y="468" text-anchor="middle" class="s">hub 派给主人的 Agent</text>
  <text x="590" y="492" text-anchor="middle" class="s">准备失败可重做</text>

  <line x1="680" y1="460" x2="708" y2="460" class="flow" marker-end="url(#a)"/>
  <rect x="710" y="380" width="180" height="160" rx="12" class="card"/>
  <text x="800" y="416" text-anchor="middle" class="t">角色 Agent</text>
  <text x="800" y="444" text-anchor="middle" class="s">借委托人权限</text>
  <text x="800" y="468" text-anchor="middle" class="s">查依据、起草、比较方案</text>
  <text x="800" y="492" text-anchor="middle" class="s">也接受人的主动委托</text>
  <text x="800" y="516" text-anchor="middle" class="s">只准备，不生效</text>

  <line x1="890" y1="460" x2="918" y2="460" class="flow" marker-end="url(#a)"/>
  <rect x="920" y="380" width="180" height="160" rx="12" class="card"/>
  <text x="1010" y="416" text-anchor="middle" class="t">专业判断与规划</text>
  <text x="1010" y="444" text-anchor="middle" class="s">人：确认、取舍、授予</text>
  <text x="1010" y="468" text-anchor="middle" class="s">Jev：明确选项评价</text>
  <text x="1010" y="492" text-anchor="middle" class="s">规则与专业工具</text>

  <line x1="1100" y1="460" x2="1128" y2="460" class="flow" marker-end="url(#a)"/>
  <rect x="1130" y="380" width="180" height="160" rx="12" class="card"/>
  <text x="1220" y="416" text-anchor="middle" class="t">协同行动</text>
  <text x="1220" y="444" text-anchor="middle" class="s">工作面签字</text>
  <text x="1220" y="468" text-anchor="middle" class="s">门面原子方法与权限</text>
  <text x="1220" y="492" text-anchor="middle" class="s">授权内自动推进</text>
  <text x="1220" y="516" text-anchor="middle" class="s">既有系统操作</text>

  <line x1="1220" y1="380" x2="1220" y2="334" class="flow" marker-end="url(#a)"/>
  <text x="1230" y="362" class="l">状态与结果回写</text>

  <!-- 契 -->
  <rect x="290" y="620" width="1020" height="150" rx="12" class="core"/>
  <text x="314" y="654" class="t">契｜能力规范与分层组织记忆</text>
  <rect x="320" y="672" width="230" height="78" rx="10" class="white"/>
  <text x="435" y="702" text-anchor="middle" class="t">依据</text>
  <text x="435" y="728" text-anchor="middle" class="s">资料片段 · 来源指纹</text>
  <line x1="550" y1="711" x2="618" y2="711" class="flow" marker-end="url(#a)"/>
  <text x="584" y="700" text-anchor="middle" class="l">专业确认</text>
  <rect x="620" y="672" width="230" height="78" rx="10" class="white"/>
  <text x="735" y="702" text-anchor="middle" class="t">结论</text>
  <text x="735" y="728" text-anchor="middle" class="s">确认人 · 完整适用条件</text>
  <line x1="850" y1="711" x2="918" y2="711" class="flow" marker-end="url(#a)"/>
  <text x="884" y="700" text-anchor="middle" class="l">明确授予</text>
  <rect x="920" y="672" width="230" height="78" rx="10" class="white"/>
  <text x="1035" y="702" text-anchor="middle" class="t">能力</text>
  <text x="1035" y="728" text-anchor="middle" class="s">按层、对象与条件 · 可撤销</text>
  <text x="1230" y="702" text-anchor="middle" class="s">阅读视图：能读什么</text>
  <text x="1230" y="728" text-anchor="middle" class="s">能力视图：能用什么</text>

  <!-- 契与循环的关系 -->
  <line x1="380" y1="620" x2="380" y2="543" class="feed" marker-end="url(#b)"/>
  <text x="390" y="586" class="l">能力视图限定可提出的事项</text>
  <line x1="800" y1="620" x2="800" y2="543" class="feed" marker-end="url(#b)"/>
  <text x="810" y="586" class="l">可读结论与可用能力</text>
  <line x1="1010" y1="540" x2="1010" y2="617" class="flow" marker-end="url(#a)"/>
  <text x="1020" y="586" class="l">确认与授予</text>

  <!-- 学习反馈 -->
  <path d="M1260 540 V596 H1326 V818 H276 V470 H287" class="feed" marker-end="url(#b)"/>
  <text x="800" y="845" text-anchor="middle" class="l">人的处置与业务结果成为觉的学习标签；学习改变关注方式，不改变授权</text>

  <!-- 既有系统 -->
  <rect x="1370" y="266" width="190" height="290" rx="14" class="white"/>
  <text x="1465" y="302" text-anchor="middle" class="t">既有系统</text>
  <text x="1465" y="340" text-anchor="middle" class="s">企业 RAG / 知识库</text>
  <text x="1465" y="368" text-anchor="middle" class="s">企业微信 · E+</text>
  <text x="1465" y="396" text-anchor="middle" class="s">ELN · LIMS</text>
  <text x="1465" y="424" text-anchor="middle" class="s">CRM · ERP</text>
  <text x="1465" y="452" text-anchor="middle" class="s">私有化模型网关</text>
  <line x1="1312" y1="440" x2="1368" y2="440" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- 验证场景 -->
  <rect x="120" y="900" width="1360" height="80" rx="14" class="white"/>
  <text x="160" y="947" class="t">首个验证场景｜传化功能化学</text>
  <text x="1440" y="947" text-anchor="end" class="s">客户需求  →  产品判断  →  研发与试样  →  成果回流  →  下一单复用</text>

  <!-- 图例 -->
  <line x1="120" y1="1022" x2="160" y2="1022" class="flow"/>
  <text x="170" y="1027" class="l">业务推进</text>
  <line x1="260" y1="1022" x2="300" y2="1022" class="feed"/>
  <text x="310" y="1027" class="l">能力供给与学习反馈</text>
  <rect x="470" y="1012" width="20" height="20" rx="5" class="core"/>
  <text x="500" y="1027" class="l">核心机制</text>
  <text x="1480" y="1027" text-anchor="end" class="l">显式组织目标、跨项目依赖与资源统筹为继续建设的目标能力</text>
</svg>
