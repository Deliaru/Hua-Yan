<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1125" viewBox="0 0 680 750" role="img">
<title>化言：完整架构与运行链路</title>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#73726c;stroke-width:1.2;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="750" fill="#ffffff"/>
<g class="c-gray"><rect x="40" y="40" width="300" height="56" rx="8"/><text class="th" x="190" y="58">对话提问（L1）</text><text class="ts" x="190" y="78">客户 ↔ 业务员，转写文本</text></g>
<line x1="340" y1="60" x2="378" y2="60" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="380" y="40" width="240" height="56" rx="8"/><text class="th" x="500" y="58">事件流</text><text class="ts" x="500" y="78">对话、检索、升级、试样结果</text></g>
<line x1="190" y1="96" x2="190" y2="124" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="96" x2="500" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="126" width="300" height="56" rx="8"/><text class="th" x="190" y="144">需求抽取 Agent</text><text class="ts" x="190" y="164">现象 → 槽位，每项绑定客户原话</text></g>
<g class="c-teal"><rect x="380" y="126" width="240" height="56" rx="8"/><text class="th" x="500" y="144">觉 · 发现层</text><text class="ts" x="500" y="164">实时＋定时扫描</text></g>
<line x1="190" y1="182" x2="190" y2="210" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="182" x2="500" y2="210" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="212" width="300" height="56" rx="8"/><text class="th" x="190" y="230">分级检索</text><text class="ts" x="190" y="250">权限引擎过滤，L1 只见 L1 知识</text></g>
<g class="c-teal"><rect x="380" y="212" width="240" height="56" rx="8"/><text class="th" x="500" y="230">实时：追问补全</text><text class="ts" x="500" y="250">缺关键槽位，提示业务员</text></g>
<path d="M380 240 L360 240 L360 82 L342 82" class="arr" marker-end="url(#arrow)"/>
<path d="M620 154 L634 154 L634 326 L622 326" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="268" x2="190" y2="296" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="298" width="300" height="56" rx="8"/><text class="th" x="190" y="316">Jev：匹配产品</text><text class="ts" x="190" y="336">候选产品 A/B/C ＋ 都不合适</text></g>
<g class="c-teal"><rect x="380" y="298" width="240" height="56" rx="8"/><text class="th" x="500" y="316">定时：汇聚·冲突·泄露</text><text class="ts" x="500" y="336">发布为带悬赏的问题</text></g>
<line x1="190" y1="354" x2="190" y2="382" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="354" x2="500" y2="382" class="arr" marker-end="url(#arrow)"/>
<path d="M340 326 L360 326 L360 412 L378 412" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="384" width="300" height="56" rx="8"/><text class="th" x="190" y="402">披露网关 → 推荐卡片</text><text class="ts" x="190" y="422">按客户画像出版本，低置信交审批</text></g>
<g class="c-purple"><rect x="380" y="384" width="240" height="56" rx="8"/><text class="th" x="500" y="402">问题总线</text><text class="ts" x="500" y="422">升级（把握不足）与发现 → 路由</text></g>
<path d="M440 440 L440 460 L190 460 L190 478" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="480" width="300" height="56" rx="8"/><text class="th" x="190" y="498">产品经理（L2）</text><text class="ts" x="190" y="518">Agent 起草产品需求，PM 确认</text></g>
<line x1="340" y1="508" x2="378" y2="508" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="380" y="480" width="240" height="56" rx="8"/><text class="th" x="500" y="498">研发需求单</text><text class="ts" x="500" y="518">化学语言，原话可回查</text></g>
<line x1="500" y1="536" x2="500" y2="564" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="380" y="566" width="240" height="56" rx="8"/><text class="th" x="500" y="584">研发（L3）</text><text class="ts" x="500" y="604">完整需求·ELN 开发·试样评价</text></g>
<line x1="380" y1="594" x2="342" y2="594" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="566" width="300" height="56" rx="8"/><text class="th" x="190" y="584">说明书发布</text><text class="ts" x="190" y="604">回到 L1 知识库，下次直接推荐</text></g>
<path d="M40 594 L22 594 L22 240 L38 240" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="622" x2="500" y2="650" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="652" width="580" height="56" rx="8"/><text class="th" x="330" y="670">知识归属人（研发）＋ 贡献账本</text><text class="ts" x="330" y="690">审批低置信披露 · 接悬赏补知识 · 被引用与试样成功即记分</text></g>
<rect x="40" y="722" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="ts" x="58" y="728" style="text-anchor:start;fill:#5F5E5A">觉：发现</text>
<rect x="150" y="722" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/><text class="ts" x="168" y="728" style="text-anchor:start;fill:#5F5E5A">Agent / Jev：自动处理</text>
<rect x="320" y="722" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="ts" x="338" y="728" style="text-anchor:start;fill:#5F5E5A">人工步骤 / 输入输出</text>
</svg>
