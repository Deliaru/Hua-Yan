<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="真正到研发的需求：研发需退回比例 业务员转述95.1%、一次性翻译95.1%、化言规则觉65.9%、化言Jue-K 19.5%；关键信息完整率 49.2%、50.8%、75.8%、90.9%">
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.ax{stroke:#c9c8c2;stroke-width:1}
.hi{fill:#2a78d6}.lo{fill:#c9c8c2}
text{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.ax{stroke:#4a4946}.hi{fill:#3987e5}.lo{fill:#4f4e4b}}
</style>
<rect class="bg" width="800" height="300" rx="12"/>
<text class="t1" x="28" y="40" font-size="20" font-weight="600">真正到研发的需求，化言让研发少退回、信息更完整</text>
<text class="t2" x="28" y="64" font-size="13">300 张模拟需求卡中应升级的 41 张 · 同一批卡、同一个模拟客户随机种子</text>
<text class="t2" x="190" y="100" font-size="13" font-weight="600">研发需退回比例　↓ 越低越好</text>
<text class="t2" x="500" y="100" font-size="13" font-weight="600">关键信息完整率　↑ 越高越好</text>
<text class="t2" x="176" y="133" font-size="14" text-anchor="end">业务员转述（现状）</text>
<path class="lo" d="M190 116 h252.8 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-252.8 z"/>
<text class="t2" x="454.8" y="133" font-size="14">95.1%</text>
<path class="lo" d="M500 116 h128.8 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-128.8 z"/>
<text class="t2" x="640.8" y="133" font-size="14">49.2%</text>
<text class="t2" x="176" y="171" font-size="14" text-anchor="end">一次性翻译</text>
<path class="lo" d="M190 154 h252.8 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-252.8 z"/>
<text class="t2" x="454.8" y="171" font-size="14">95.1%</text>
<path class="lo" d="M500 154 h133.2 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-133.2 z"/>
<text class="t2" x="645.2" y="171" font-size="14">50.8%</text>
<text class="t2" x="176" y="209" font-size="14" text-anchor="end">化言 · 规则觉</text>
<path class="lo" d="M190 192 h173.9 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-173.9 z"/>
<text class="t2" x="375.9" y="209" font-size="14">65.9%</text>
<path class="lo" d="M500 192 h200.7 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-200.7 z"/>
<text class="t2" x="712.7" y="209" font-size="14">75.8%</text>
<text class="t1" x="176" y="247" font-size="14" text-anchor="end" font-weight="700">化言 · Jue-K</text>
<path class="hi" d="M190 230 h48.6 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-48.6 z"/>
<text class="t1" x="250.7" y="247" font-size="14" font-weight="700">19.5%</text>
<path class="hi" d="M500 230 h241.4 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-241.4 z"/>
<text class="t1" x="753.4" y="247" font-size="14" font-weight="700">90.9%</text>
<line class="ax" x1="190" y1="110" x2="190" y2="264"/><line class="ax" x1="500" y1="110" x2="500" y2="264"/>
<text class="t3" x="28" y="286" font-size="11">模拟数据上的相对比较 · 出处 docs/reports/distortion/ · 研发需退回 = 现象不明，或任一研发必问信息缺失 / 错误</text>
