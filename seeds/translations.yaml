placeholder: true
source: "占位：由大模型按印染行业常识编写的转化对照，非任何企业资料。L2 = 产品经理的「客户场景说法 → 产品需求语言」；L3 = 研发的「产品需求说法 → 化学语言」"
items:
  # ---- L2：客户场景说法 → 产品需求语言（产品经理）----
  - {id: tr:1, scene_phrase: 深一块浅一块, chem_term: 需要匀染类助剂，改善上染均匀性, level: 2, owner: pm:P01, phenomenon_ids: [color_unlevel]}
  - {id: tr:2, scene_phrase: 气流, chem_term: 需要在低浴比条件下仍能保持匀染效果的助剂, level: 2, owner: pm:P01, phenomenon_ids: [color_unlevel]}
  - {id: tr:3, scene_phrase: 弹力, chem_term: 弹力面料（含氨纶），需要兼顾锦纶匀染与氨纶保护, level: 2, owner: pm:P01, phenomenon_ids: [color_unlevel]}
  - {id: tr:4, scene_phrase: 回修, chem_term: 需要一次成功率高、减少回修的匀染方案, level: 2, owner: pm:P01, phenomenon_ids: [color_unlevel]}
  - {id: tr:5, scene_phrase: 浅色, chem_term: 浅色对匀染要求更高，需要缓染效果明显的助剂, level: 2, owner: pm:P01, phenomenon_ids: [color_unlevel]}
  - {id: tr:6, scene_phrase: 每缸颜色对不上, chem_term: 需要提高批次重现性、稳定染浴条件的助剂, level: 2, owner: pm:P01, phenomenon_ids: [shade_variation]}
  - {id: tr:7, scene_phrase: 井水, chem_term: 水质偏硬，需要耐硬水或带螯合作用的助剂, level: 2, owner: pm:P01, phenomenon_ids: [shade_variation, color_spots]}
  - {id: tr:8, scene_phrase: 布面有斑点, chem_term: 需要防止染料或杂质沉积的分散类助剂, level: 2, owner: pm:P01, phenomenon_ids: [color_spots]}
  - {id: tr:9, scene_phrase: 一洗就掉色, chem_term: 需要提高湿处理牢度的固色或净洗助剂, level: 2, owner: pm:P01, phenomenon_ids: [poor_fastness]}
  - {id: tr:10, scene_phrase: 摩擦掉色, chem_term: 需要去除表面浮色、提高摩擦牢度的净洗方案, level: 2, owner: pm:P01, phenomenon_ids: [poor_fastness]}
  - {id: tr:11, scene_phrase: 硬邦邦, chem_term: 需要柔软整理剂，改善手感, level: 2, owner: pm:P01, phenomenon_ids: [harsh_hand]}
  - {id: tr:12, scene_phrase: 鸡爪印, chem_term: 需要绳状染色用的防皱润滑助剂, level: 2, owner: pm:P01, phenomenon_ids: [crease_marks]}
  - {id: tr:13, scene_phrase: 白布不白, chem_term: 需要提高白度的增白或漂白助剂, level: 2, owner: pm:P01, phenomenon_ids: [low_whiteness]}
  - {id: tr:14, scene_phrase: 布变脆, chem_term: 需要在前处理中保护纤维强力的助剂, level: 2, owner: pm:P01, phenomenon_ids: [strength_loss]}
  - {id: tr:15, scene_phrase: 发黄, chem_term: 需要防黄变整理，避免存放和定形中变黄, level: 2, owner: pm:P01, phenomenon_ids: [yellowing]}
  - {id: tr:16, scene_phrase: 白地被染上颜色, chem_term: 需要防止浮色回沾的皂洗或防沾色助剂, level: 2, owner: pm:P01, phenomenon_ids: [bleeding_staining]}

  # ---- L3：产品需求说法 → 化学语言（研发 R01：染色过程化学；研发 R02：弹力面料与整理）----
  - {id: tr:17, scene_phrase: 匀染, chem_term: （模拟）对酸性染料有缓染作用、与染料竞争纤维染座的阴离子型组分, level: 3, owner: rd:R01, phenomenon_ids: [color_unlevel]}
  - {id: tr:18, scene_phrase: 低浴比, chem_term: （模拟）低浴比下染液交换快、局部染料浓度高，需随升温缓释酸，使染浴 pH 由中性逐步降至弱酸性，控制酸性染料初染速率, level: 3, owner: rd:R01, phenomenon_ids: [color_unlevel]}
  - {id: tr:19, scene_phrase: 上染均匀性, chem_term: （模拟）锦纶上酸性染料的关键上染区间在 40–70 ℃，需在该区间同时控制升温速率与 pH, level: 3, owner: rd:R01, phenomenon_ids: [color_unlevel]}
  - {id: tr:20, scene_phrase: 缓染, chem_term: （模拟）缓染组分与染料形成可逆缔合，随温度升高逐步释放染料，降低初期上染速率, level: 3, owner: rd:R01, phenomenon_ids: [color_unlevel]}
  - {id: tr:21, scene_phrase: 锦纶氨纶, chem_term: （模拟）氨纶段对酸性染料亲和力低，需同时控制锦纶上染速率与氨纶沾色, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel, bleeding_staining]}
  - {id: tr:22, scene_phrase: 氨纶保护, chem_term: （模拟）氨纶不耐高温和强碱，染色温度不宜超过 98 ℃，避免强碱与氧化剂，助剂不得溶胀氨纶, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel]}
  - {id: tr:23, scene_phrase: 气流染色机, chem_term: （模拟）气流染色机浴比约 1:3–1:5、布速高，需要低泡、耐剪切、在少量水中仍能起效的组分, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel, crease_marks]}
  - {id: tr:24, scene_phrase: 弹力面料, chem_term: （模拟）弹力面料在高张力下易出现经向条花，需降低织物与设备之间的摩擦与张力, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel, crease_marks]}
  - {id: tr:25, scene_phrase: 色光, chem_term: （模拟）匀染组分不得与染料形成有色络合物，对色光和得色深度的影响需控制在可接受范围, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel]}
  - {id: tr:26, scene_phrase: 回修, chem_term: （模拟）回修剥色会损伤氨纶并降低色牢度，需从首缸工艺控制，避免依赖剥色回修, level: 3, owner: rd:R02, phenomenon_ids: [color_unlevel]}
  - {id: tr:27, scene_phrase: 批次重现性, chem_term: （模拟）批次间色差主要来自染浴 pH 漂移和水中金属离子，需缓冲体系与螯合组分共同稳定, level: 3, owner: rd:R01, phenomenon_ids: [shade_variation]}
  - {id: tr:28, scene_phrase: 染浴条件, chem_term: （模拟）浴比、升温曲线、pH 任一项波动都会改变上染率，优先用缓冲对替代醋酸稳定 pH, level: 3, owner: rd:R01, phenomenon_ids: [shade_variation]}
  - {id: tr:29, scene_phrase: 耐硬水, chem_term: （模拟）钙镁离子与阴离子染料和助剂形成不溶物，需多齿螯合组分, level: 3, owner: rd:R01, phenomenon_ids: [shade_variation, color_spots]}
  - {id: tr:30, scene_phrase: 螯合, chem_term: （模拟）聚羧酸与有机膦酸类组分螯合二价金属离子，并分散已形成的沉淀, level: 3, owner: rd:R01, phenomenon_ids: [shade_variation, color_spots, strength_loss]}
  - {id: tr:31, scene_phrase: 分散类助剂, chem_term: （模拟）吸附在染料颗粒表面形成空间位阻与电荷排斥，阻止高温下染料凝聚, level: 3, owner: rd:R01, phenomenon_ids: [color_spots]}
  - {id: tr:32, scene_phrase: 沉积, chem_term: （模拟）色点多为金属离子沉淀或分散染料焦油化凝聚物沉积，需先区分来源再选螯合或分散方案, level: 3, owner: rd:R01, phenomenon_ids: [color_spots]}
  - {id: tr:33, scene_phrase: 湿处理牢度, chem_term: （模拟）水解染料与未固着染料残留是主因，需充分皂洗后再用固色组分封闭, level: 3, owner: rd:R02, phenomenon_ids: [poor_fastness]}
  - {id: tr:34, scene_phrase: 固色, chem_term: （模拟）纤维素纤维用阳离子聚合物与阴离子染料成盐；锦纶用阴离子缩合物在表面形成屏障层, level: 3, owner: rd:R02, phenomenon_ids: [poor_fastness]}
  - {id: tr:35, scene_phrase: 浮色, chem_term: （模拟）涤纶表面残留分散染料需还原清洗破坏发色体，弱酸性条件下进行可减少对氨纶的损伤, level: 3, owner: rd:R01, phenomenon_ids: [poor_fastness, bleeding_staining]}
  - {id: tr:36, scene_phrase: 摩擦牢度, chem_term: （模拟）深色摩擦牢度主要取决于表面浮色量，与染料提升力和皂洗是否充分相关, level: 3, owner: rd:R01, phenomenon_ids: [poor_fastness]}
  - {id: tr:37, scene_phrase: 柔软整理, chem_term: （模拟）改性有机硅在纤维表面定向排列形成润滑膜；亲水改性保留吸湿性，控制氨值降低黄变, level: 3, owner: rd:R02, phenomenon_ids: [harsh_hand, yellowing]}
  - {id: tr:38, scene_phrase: 手感, chem_term: （模拟）手感发硬多因前处理残留碱、盐或助剂成膜过硬，需先确认布面 pH 与残留再选柔软剂, level: 3, owner: rd:R02, phenomenon_ids: [harsh_hand]}
  - {id: tr:39, scene_phrase: 防皱润滑, chem_term: （模拟）高分子润滑组分在织物间形成水化层，降低玻璃化温度以上折叠处的压力集中, level: 3, owner: rd:R02, phenomenon_ids: [crease_marks]}
  - {id: tr:40, scene_phrase: 绳状染色, chem_term: （模拟）高温段后降温过快是折痕定形的主因，130 ℃ 后降温宜控制在 2 ℃/min 以内, level: 3, owner: rd:R02, phenomenon_ids: [crease_marks]}
  - {id: tr:41, scene_phrase: 增白, chem_term: （模拟）二苯乙烯类荧光增白剂适用纤维素纤维，涤纶需用分散型增白剂，两者不能互替, level: 3, owner: rd:R02, phenomenon_ids: [low_whiteness]}
  - {id: tr:42, scene_phrase: 漂白, chem_term: （模拟）双氧水无效分解导致有效氧不足且损伤纤维，需稳定组分控制分解速率, level: 3, owner: rd:R02, phenomenon_ids: [low_whiteness, strength_loss]}
  - {id: tr:43, scene_phrase: 纤维强力, chem_term: （模拟）纤维素在强碱高温氧化条件下聚合度下降，金属离子催化双氧水分解会加剧损伤, level: 3, owner: rd:R02, phenomenon_ids: [strength_loss]}
  - {id: tr:44, scene_phrase: 前处理, chem_term: （模拟）前处理碱浓度与温度需匹配，残留铁离子需预先螯合, level: 3, owner: rd:R02, phenomenon_ids: [strength_loss]}
  - {id: tr:45, scene_phrase: 防黄变, chem_term: （模拟）酚类抗氧剂与氮氧化物生成醌类黄色物质，需酸性屏障层阻断反应, level: 3, owner: rd:R02, phenomenon_ids: [yellowing]}
  - {id: tr:46, scene_phrase: 定形, chem_term: （模拟）高温定形时氨基硅油氧化与氨纶热黄变叠加，定形温度与柔软剂氨值需同时控制, level: 3, owner: rd:R02, phenomenon_ids: [yellowing]}
  - {id: tr:47, scene_phrase: 防沾色, chem_term: （模拟）聚丙烯酸类分散组分包裹脱落染料使其留在水相，阻止回沾, level: 3, owner: rd:R02, phenomenon_ids: [bleeding_staining]}
  - {id: tr:48, scene_phrase: 浮色回沾, chem_term: （模拟）皂洗温度不足或换水不充分时，脱落染料在降温段重新吸附到白地, level: 3, owner: rd:R02, phenomenon_ids: [bleeding_staining]}
  - {id: tr:49, scene_phrase: 氨纶沾色, chem_term: （模拟）分散染料易沾污氨纶，需优先吸附在氨纶上的阻沾组分占据吸附位点, level: 3, owner: rd:R02, phenomenon_ids: [bleeding_staining]}
