    product_id: HY-LV205
    owner: rd:R01
    title: 内部评价 · HY-LV205 近一季度客户反馈
    text: "（模拟）近一季度 6 家锦氨面料客户试用，5 家反馈色花改善；1 家在气流染色机上效果不稳定（不在标注适用设备内）。报价可参考同类匀染剂中档。"
  - kind: report
