    product_id: HY-LV205
    title: 公开案例 · 锦氨弹力面料溢流缸色花
    text: "（模拟，已脱敏）某弹力面料染厂用溢流染色机染锦纶氨纶浅色，布面发花、回修多次。改用 HY-LV205，染前加入并在 40 ℃ 运行 10 分钟后加染料，一次合格率明显提高。"
  - kind: public_case
    source_case: case:3
    product_id: HY-CH310
    title: 公开案例 · 硬水染棉布面色点
    text: "（模拟，已脱敏）某棉布染厂使用地下水，布面出现细小色点，更换染料批次无改善。染前加入 HY-CH310 并取用量上限后，色点基本消除。"
