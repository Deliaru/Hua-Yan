placeholder: true
source: "占位：由大模型按印染行业常识编写的模拟数据，非任何企业资料，待企业数据替换"
items:
  - id: fiber
    label: 面料成分
    values: [棉, 涤纶, 涤棉, 锦纶, 锦纶氨纶, 粘胶]
    ask_text: 请问是什么面料？什么成分的布？
    ask_keywords: [面料, 什么布, 成分, 材质, 布料, 什么料子]
    customer_phrases:
      棉: [纯棉的, 全棉布, 纯棉布]
      涤纶: [纯涤的, 涤纶布, 化纤布, 聚酯的]
      涤棉: [涤棉混纺, T/C布, 涤棉布]
      锦纶: [纯尼龙, 尼龙布, 锦纶布]
      锦纶氨纶: [锦纶氨纶的, 尼龙加弹力的, 锦氨, 尼龙弹力布, 加了氨纶的尼龙]
      粘胶: [人棉, 人造棉, 粘纤, 莫代尔那种]
  - id: dye_class
    label: 染料类型
    values: [活性染料, 分散染料, 酸性染料, 还原染料]
    ask_text: 用的是哪一类染料？
    ask_keywords: [染料, 什么料染, 哪类染, 染的什么料]
    customer_phrases:
      活性染料: [活性的, 用的活性, 活性料]
      分散染料: [分散的, 用的分散, 分散料]
      酸性染料: [酸性的料, 酸性料, 尼龙用的那种料]
      还原染料: [还原的, 用还原料, 还原染的]
  - id: process
    label: 染色工艺
    values: [浸染, 连续轧染, 冷轧堆, 印花]
    ask_text: 是浸染、轧染还是印花？
    ask_keywords: [工艺, 浸染还是, 怎么染, 轧染还是, 怎么做的]
    customer_phrases:
      浸染: [缸里染的, 在缸里煮, 浸染的]
      连续轧染: [轧染的, 连续车上做的, 走轧车]
      冷轧堆: [冷堆的, 冷轧的, 打卷放一晚上]
      印花: [印花的, 印的花型, 印花布]
  - id: equipment
    label: 染色设备
    values: [溢流染色机, 气流染色机, 卷染机, 经轴染色机]
    ask_text: 用的是什么染色设备？溢流还是气流？
    ask_keywords: [设备, 什么缸, 染色机, 机台, 什么机器]
    customer_phrases:
      溢流染色机: [溢流缸, 溢流机, 普通溢流]
      气流染色机: [气流缸, 气流机, 风缸]
      卷染机: [卷染缸, 卷染机上, 在卷染上做]
      经轴染色机: [经轴缸, 经轴机, 卷在经轴上]
  - id: bath_ph
    label: 染浴 pH
    values: [强酸性, 弱酸性, 中性, 碱性]
    ask_text: 染浴 pH 大概控制在多少？
    ask_keywords: [pH, PH, 酸碱, 加酸还是加碱]
    customer_phrases:
      强酸性: [pH三点几, 酸放得很多, 调得很酸]
      弱酸性: [pH五左右, 加点醋酸调的, 微微偏酸]
      中性: [pH七左右, 不调pH, 基本不加酸碱]
      碱性: [加了纯碱, 碱放得多, pH十以上]
  - id: water
    label: 水质
    values: [软水, 自来水, 硬水, 回用水]
    ask_text: 车间用的什么水？水质硬不硬？
    ask_keywords: [水质, 什么水, 水硬, 硬度]
    customer_phrases:
      软水: [软化过的水, 过了软水器, 水是软化的]
      自来水: [市政供水, 普通的水, 城市管网水]
      硬水: [井水, 水比较硬, 地下水]
      回用水: [中水回用, 回收的水, 循环水]
  - id: constraint
    label: 限制条件
    values: [无特殊要求, 无APEO, 低泡, 低温节能]
    ask_text: 有没有环保、泡沫或者温度方面的限制？
    ask_keywords: [环保, 限制, 有什么要求, 特殊要求]
    customer_phrases:
      无特殊要求: [没什么要求, 没有特别要求, 没啥限制]
      无APEO: [不能含APEO, 要环保的, 出口要过环保]
      低泡: [不能起泡, 泡沫要少, 怕起泡]
      低温节能: [温度不能太高, 想省蒸汽, 低温染]
