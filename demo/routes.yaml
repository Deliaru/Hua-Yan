# v6 开场入口（模拟数据）：每条只代客户说出第一句，后续台词只作为「演示自动填入」提示，由看的人发出、可改写。
# 路径与证据点见 docs/workpackages/REPLAN-v6.md 0′.5。V6-5 的 scripts/demo_routes.py 复用这里的台词。
routes:
  - id: A
    title: 常规问题，客户自助解决
    customer: customer:C01
    lines: ["深一块浅一块", "锦氨的，溢流缸"]
    hint: 客户答完觉的追问即拿到推荐与公开案例；切到业务员、产品经理、研发，都没有这件事。
  - id: B
    title: 有商务诉求，交给业务员
    customer: customer:C02
    lines: ["深一块浅一块", "锦氨的，溢流缸", "这个产品想要个报价"]
    hint: 最后一句是报价诉求，觉自动交给归属业务员；切到业务员，事项带着完整原话和已推荐产品。
  - id: C
    title: 现有产品不合适，需求直达研发
    customer: customer:C03
    lines: ["白地被沾色了", "锦纶的布，尼龙用的那种料，缸里染的"]
    hint: 客户只说现象，看「研发开工需要的条件」逐项被问出来；再切到研发，看开工门槛和「如果只靠开场白」。
  - id: C′
    title: 同类需求再来一次（研发判过「已有产品适用」之后）
    customer: customer:C04
    lines: ["白地被沾色了", "锦纶的布，尼龙用的那种料，缸里染的"]
    hint: 先在 C 里让研发选「不立项：已有产品适用」并由产品经理签扩范围；再开这一条，客户自助阶段就拿到产品，研发收件箱没有新单。
  - id: D
    title: 重复的短平快需求，汇成一个课题
    customer: customer:C01
    lines: ["深一块浅一块，锦氨的，气流缸"]
    hint: 用不同客户再开一次 D（右侧切换客户），觉发现同类需求，产品经理签机会并写商业判断，研发只收到一张合并单。
