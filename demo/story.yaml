# v6 演示讲解（REPLAN-v6 V6-5.5，模拟数据）：一家企业的一个上午，6 位客户、6 个需求。台词与 demo/routes.yaml 相同，
# 与 scripts/demo_routes.py 是同一批需求，跑完后的账本数字与 docs/reports/v6_routes/metrics.json 的 v6 列一致。
# 每一步的 do 由服务端真的执行（经 Api.call，与浏览器里点按钮一致）；view 是执行后切到哪个工作面看哪个对象。
#   do：open 开场（route、可选 customer，as 记为句柄）· say 该句柄的下一句台词（press: quote 表示用「我要报价」按钮说）
#       decline 研发不立项（已有产品适用）· scope 产品经理签扩适用范围 · merge 产品经理签机会 · accept 研发接单
#       点「下一步」时服务端先执行 open（客户来了、说出第一句）；其余动作由讲解栏引导看的人在工作面上亲手点（按钮呼吸高亮），
#       也可以点「替我做这一步」。录制回放下工作面按钮发出的请求与服务端代做完全相同。
#   view：page 工作面；focus 句柄（会话）或 req:句柄（该会话的需求单）；研发页的身份取需求单的指派研发
#   expect：执行后剧本预期的会话状态（句柄 → open / recommended / escalated）；真实模型跑出来不同时，讲解栏如实说明
#   look：讲完这一步，引导点需求轨迹上的某个角色格，切过去看这个角色在这件事里能做什么、要做什么、在做什么
#   章节 needs：接入自己的模型时「按路径看」只补跑这一章和它依赖的章
# 讲解五段：happened 发生了什么 · before 过去怎么做 · freed 解放了谁的什么 · money 降本增效（↑）· fame 体验与影响力（★）；没有就不写。
chapters:
  - {id: 开场, title: 一线的一句话}
  - {id: A, title: 常规问题客户自助}
  - {id: B, title: 商务诉求交业务员}
  - {id: C, title: 新问题直达研发，判一次组织记住}
  - {id: C′, title: 同类问题再来自助解决, needs: [C]}
  - {id: D, title: 短平快汇成课题}
  - {id: 收尾, title: 这个上午解放了多少生产力}
steps:
  - chapter: 开场
    title: 一线的一句话
    view: {page: customer, who: "customer:C01"}
    happened: 「需求不明确，产品开发了不达标一直返工，才没有精力做中长期课题。」——来自功能化学一线业务需求交流。
    before: 客户只会说现象；业务员记下来，产品经理转述一遍，到研发手里已经不全、走了样。研发边开发边回头补问，试样不达标就返工；同类问题下次又从头来。
    freed: 接下来是一家企业的一个上午：6 位客户，6 个需求。每点一次「下一步」，系统都会真的执行这一步，旁边是真实的工作面。看化言怎样在研发开工前把需求说清楚，并让组织记住每一次判断。
    money: 研发的时间是企业最贵的产能。返工和重复劳动每少一次，就多一份时间留给能做出新品的中长期课题。

  - chapter: A
    title: 客户自己来问，只说现象
    do: [{open: A, as: a}]
    view: {page: customer, focus: a}
    happened: 印染厂 A 只说了一句「深一块浅一块」。觉判断：要推荐产品，还缺面料和染色设备，于是直接向客户追问。
    before: 客户打电话给业务员；业务员凭经验问几句、记下来，拿不准就转给产品经理，再找研发。
    freed: 业务员不用再当技术问答的入口；客户也不用等。

  - chapter: A
    title: 答完两个问题，当场拿到推荐
    do: [{say: a}]
    expect: {a: recommended}
    view: {page: customer, focus: a}
    happened: 客户回答「锦氨的，溢流缸」，化言当场给出推荐卡：说明书、用法和公开案例。研发的机理与配方不对外。
    before: 同样的问题业务员每周要答很多遍；答偏了，需求就带着偏差一路传到研发。
    freed: 常规问题在客户这一层就闭合，业务员、产品经理、研发都没有被打扰。看顶部账本「业务员少做的技术问答」。
    money: 业务员的时间回到报价、开单和客户关系上，商务工作的产出随之提升。
    fame: 下游印染厂随时自助拿到专业答复和公开案例，服务体验直接提升。

  - chapter: B
    title: 另一位客户要报价，直接交给业务员
    do: [{open: B, as: b}, {say: b}, {say: b, press: quote}]
    expect: {b: recommended}
    view: {page: sales, who: "sales:S01", focus: b}
    happened: 印染厂 B 同样自助拿到推荐，接着说「这个产品想要个报价」。觉判断这是商务诉求，自动交给归属业务员；业务员看到的是完整原话和已推荐的产品。
    before: 客户把问题从头再讲一遍，业务员重新记录，再回头去问技术。
    freed: 业务员不用重新采集需求，接手就是报价。
    money: 从提问到报价的路径变短，商机不在转述和等待中流失。

  - chapter: C
    title: 一个新问题：客户只说「白地被沾色了」
    do: [{open: C, as: c}]
    view: {page: customer, focus: c}
    happened: 觉判断这类问题研发开工前必须知道面料、染料类型和染色工艺，于是在对话里直接问客户。右侧「研发开工需要的条件」会逐项亮起。
    before: 研发拿到的通常只有一句「白地沾色」，要回头找业务员补问，业务员再去问客户——一来一回就是几天。
    freed: 必问条件在客户还在线的时候就问齐，研发不再拿着半截需求开工。
    fame: 「这类问题研发开工前必须知道什么」被沉淀成可复用的需求语言，为功能化学上下游的需求描述标准化打下基础。

  - chapter: C
    title: 现有产品都不合适，需求直达研发
    do: [{say: c}]
    expect: {c: escalated}
    view: {page: customer, focus: c}
    happened: 客户答完，化言把声明能处理这类问题的已发布产品按客户条件逐一核对、排除；觉判断「现有产品都不合适」，按模板自动把需求交给研发。看中间「为什么这份需求可以直接交给研发」。
    before: 业务员签字升级 → 产品经理把需求转述一遍 → 研发。每转一手丢一部分。
    freed: 不经业务员签字，也不用产品经理逐单转述：产品经理 Agent 在后台把原话转成产品需求，每一句都带着客户原话。需求轨迹上业务员、产品经理两格都是空心的。
    look: {role: rd, text: 需求轨迹的四格都能点：点「研发」格，切到研发的工作面，看同一件事在研发那里是什么样。}

  - chapter: C
    title: 研发拿到的是一张说清楚的单
    view: {page: rd, focus: "req:c"}
    happened: 研发收到的需求单开工门槛已齐，每一条都能回查到客户原话。展开「如果只靠开场白」，看客户第一句话里其实缺了什么。
    before: 研发拿着半截需求开工，开发方向偏了，试样不达标，返工。
    freed: 研发不用补问、不用猜，只做专业判断：立项，还是不立项。
    money: 一线反馈里「一直返工」的源头，在这里被切断。

  - chapter: C
    title: 研发判断：已有产品适用，不必立项
    do: [{decline: c, product: HY-FX350, reason: 已有产品可覆盖：锦纶固色剂适用于锦纶酸性染料的白地沾色}]
    expect: {c: recommended}
    view: {page: customer, focus: c}
    happened: 研发判断锦纶固色剂其实能解决这个问题，只是说明书没标这个用法，于是选「不立项：已有产品适用」。客户这边立刻收到了这个产品的推荐——从提问到拿到方案，没有经过任何人转述。
    before: 立项评审、排期，客户等上几周，最后发现一个现成产品就能解决。
    freed: 研发几分钟的判断，代替了一次立项。
    look: {role: pm, text: 点上方需求轨迹里的「产品经理」格（橙色＝待他处理），看觉刚把什么事交给了产品经理。}
    money: 客户当天拿到方案，订单不在等待中流失；研发没有为一个已有产品能解决的问题开新项目。

  - chapter: C
    title: 觉提出：要不要把这次判断变成产品边界
    view: {page: pm, who: "pm:P01", focus: "req:c"}
    happened: 研发刚才的判断如果只留在这张单上，下次同样的问题还会进研发。觉向产品经理提出「是否扩展锦纶固色剂的适用范围」，产品经理 Agent 已经把研发的判断和客户原话并排放好。
    before: 研发审一次，下次同样的问题再来，研发再审一次。
    freed: 研发的判断不再是一次性的；产品经理只需要做一个判断，不用自己去翻单子。

  - chapter: C
    title: 产品经理签字，判断记在本人名下
    do: [{scope: HY-FX350, note: 研发判定锦纶固色剂适用于锦纶酸性染料浸染的白地沾色}]
    view: {page: ledger, who: "pm:P01"}
    happened: 产品经理签字，扩展锦纶固色剂的适用范围。看「我的知识」：「渗色沾色 → 锦纶固色剂」写进了产品匹配所用的知识，记在产品经理本人名下，签字即记分。
    before: 产品经理忙着逐单转述，没有时间维护产品组合；维护了也没有记录、没有归属。
    freed: 产品经理回到本位：管产品适用范围，而不是传话。
    money: 老产品进入了一个新场景，零研发投入新增一块市场。这类需求以后都在客户自助阶段直接成交。
    fame: 专家经验有署名、有回报：每条知识记在本人名下，被引用一次就记一次分。

  - chapter: C′
    title: 同类问题再来，客户自助就解决了
    do: [{open: C′, as: c2}, {say: c2}]
    expect: {c2: recommended}
    view: {page: customer, focus: c2}
    happened: 印染厂 D 也说「白地被沾色了」，答完问题直接拿到锦纶固色剂的推荐。研发的收件箱里没有新单。
    before: 第二张同样的单又进研发，研发再判一次。
    freed: 研发对这类用法只判断一次，组织记住了。看账本「研发少收的单」和「老产品新增适用场景」。
    look: {role: rd, text: 点需求轨迹上的「研发」格：这次研发一格是空的，研发的收件箱里没有新单。}
    money: 一次判断，反复复用：同类需求不再占用研发。
    fame: 产品经理刚才那条知识此刻被引用了一次，积分自动记到本人名下（「知识与积分」页可查）。

  - chapter: D
    title: 一个短平快需求，一句话说全了条件
    do: [{open: D, as: d1}]
    expect: {d1: escalated}
    view: {page: customer, focus: d1}
    happened: 印染厂 A 又来一个问题：「深一块浅一块，锦氨的，气流缸」。现有产品不适合气流缸，需求直达研发。

  - chapter: D
    title: 第二家客户提了同样的需求，觉看出一个机会
    do: [{open: D, customer: "customer:C02", as: d2}]
    expect: {d2: escalated}
    view: {page: pm, who: "pm:P01", focus: "req:d1"}
    happened: 印染厂 B 也提了同样的问题。觉发现同类需求反复出现、没有产品可用，提出「是否合并为一个课题」交给产品经理；产品经理 Agent 已经把两家的原话并排放好。
    before: 研发逐张接单、逐张做短平快，中长期课题被挤掉。
    freed: 重复的需求不再一张张占用研发。

  - chapter: D
    title: 产品经理附上商业判断，汇成一个课题
    do: [{merge: 两家锦氨气流缸厂同类色花，值得做一个低浴比匀染课题}]
    view: {page: rd, focus: "req:d1"}
    happened: 产品经理签字合并，写下商业判断「两家锦氨气流缸厂同类色花，值得做一个低浴比匀染课题」。研发只收到一张合并单，单头就是这条判断。
    before: 立项只有研发的技术判断，没人说这件事值不值得做。
    freed: 立项 = 产品经理的商业判断 + 研发的技术判断，研发不再独自承担立项判断。
    money: 从零散的客户抱怨里看见一个新品机会——这是新产品收入的来源。

  - chapter: D
    title: 研发接单立项
    do: [{accept: d1}]
    view: {page: rd, focus: "req:d1"}
    happened: 研发接下这张合并单，正式立项。右侧往下看「你的时间用在了哪里」：今天替研发挡掉的无效工作、保留给研发的专业判断，逐项计数。
    freed: 研发的时间花在真正新的、说清楚的需求上。

  - chapter: 收尾
    title: 这个上午，组织解放了多少生产力
    view: {page: rd, focus: "req:d1"}
    happened: 顶部账本是这个上午真实跑出来的数字。岗位之间必要的协作都保留，拿掉的是因信息缺失、转述、重复才被迫发生的工作。
    freed: 业务员回到报价开单，产品经理回到产品与机会，研发回到真正新的课题。
    look: {role: customer, text: 点需求轨迹上的「客户」格，换成客户的身份看同一件事：客户只看到研发在跟进，研发的机理与配方看不到。}
