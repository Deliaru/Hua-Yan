# 演示主线台词（WP-I2，v5）。人物、客户、产品、知识全部为模拟数据。
# 台词里只有人做的事；Agent 的准备全部由觉提出问题后 tick 派单产生，这里不写（铁律 14）。
# scripts/demo_mainline.py 逐条经 ui/server.py 的 Api.call 执行：写操作前时钟 +1 业务分钟，写后 tick 一次。
#
# 动作（每个动作对应一个接口）：
#   start:      {session, customer, sales}          开会话，返回的会话 id 绑定到别名 session
#   customer:   {session, text}                     演示者扮客户（turn，speaker=customer）
#   send:       {session, text?}                    业务员发给客户；不写 text = 发出当前 reply_draft（Agent 起草的）
#   chat:       {actor, text, session?, focus?}     人在「与 Agent 协作」里说的话（agents/chat）
#   sign:       {actor, action, args, as?}          签字按钮。签字前断言：该对象上对应 family 的问题 open、
#                                                    prepared_at 不为空、签字人是 actor；不满足即停，并打印觉此刻对该对象的判断
#   edit:       {actor, path, args}                 人直接改草稿
#   trial:      {req, passed}                       模拟 ELN 录入试样（trial）
#   checkpoint: <名字>                               检查点
#   expect:     {...}                               读接口断言，失败即停
#
# sign.action → 接口 → 断言的 family 与对象（args 里的别名运行时换成 id；as 把返回的需求单 id 绑定到别名）：
#   escalate     escalate      escalate_need        session:<session>
#   reuse/adopt  reuse/adopt   reuse_product        requirement:<req>
#   merge        merge         opportunity          该签字人名下唯一 open 的机会汇聚问题（question_id 由它得到）
#   accept       accept        accept_requirement   requirement:<req>
#   confirm      confirm       confirm_translation  requirement:<req>
#   contribute   contribute    contribution         requirement:<req>；item_index、scene_phrase、chem_term 取 contribution_drafts[0]
#   market-eval  market-eval   market_eval          requirement:<req>；args.result 是人的判断，note 取 args.note
#   points       points        seal_points          requirement:<req>；text、sealed 取 points_draft 的两栏
#   release      release       release              requirement:<req>；说明书取当前 sheet 草稿
# edit.path：
#   req-item     args {req, contains, append}   L3 条目中第一条含 contains 的，在原文后追加 append（原话与依据保留）
#   reuse-note   args {req, replace: [旧, 新]}   把复用建议里给客户的说明中的一个词替换掉
# expect：
#   hints:     {session, slots}              该会话最近一轮的追问提示槽位（集合相等）
#   recommend: {session, product}            该会话 L1 推荐的产品
#   inbox:     {actor, families}             该人「待签」（prepared）问题的 family 集合相等
#   preparing: {actor, families}             签字人为该人、仍在准备中的问题 family 集合包含这些
#   reply:     {session, contains}           业务员面前的 reply_draft 含这段文字
#   status:    {req, status}                 需求单状态

steps:
  - title: 1 追问：客户只说现象，觉提示该问面料和设备
    actions:
      - start: {session: s1, customer: customer:C01, sales: sales:S01}
      - customer: {session: s1, text: 我们染完以后布面深一块浅一块，客户老投诉}
      - expect: {hints: {session: s1, slots: [fiber, equipment]}}
      - chat: {actor: sales:S01, session: s1, text: 帮我回一句，问问是什么布、用什么缸染的}
      - send: {session: s1}
      - customer: {session: s1, text: 锦氨弹力布，气流缸，浴比很低。上次你们推荐的那个匀染剂用了，回修了三次}

  - title: 2 升级：「都不合适」概率最高，觉提出升级，业务员 Agent 起草升级说明，业务员签字
    actions:
      - sign: {actor: sales:S01, action: escalate, args: {session: s1}, as: r1}
      # 觉随即提出 reuse_product，产品经理 Agent 查 L2 知识，记「无现成产品」；然后 accept_requirement 到点、起草 L2
      - expect: {inbox: {actor: rd:R02, families: [accept_requirement]}}

  - title: 3 机会汇聚：第二位客户同类升级，查无现成产品后觉提出「同类需求是否合并立项」
    actions:
      - start: {session: s2, customer: customer:C02, sales: sales:S01}
      - customer: {session: s2, text: 锦氨布在气流机里染，颜色不匀，回修了好几次}
      - sign: {actor: sales:S01, action: escalate, args: {session: s2}, as: r2}
      # 产品经理 Agent 读两位客户的原话，判断是同一件事，起草合并（D19）
      - expect: {inbox: {actor: rd:R02, families: [opportunity, accept_requirement]}}
      - sign: {actor: rd:R02, action: merge, args: {}}
      - expect: {status: {req: r2, status: merged}}
      # 合并后 accept_requirement 重新派给产品经理 Agent，按两位客户的原话重写 L2
      - checkpoint: 研发待接单

  - title: 4 接单与 L3：研发接单（立项），研发 Agent 起草 L3，觉提出回问
    actions:
      - expect: {inbox: {actor: rd:R02, families: [accept_requirement]}}
      - sign: {actor: rd:R02, action: accept, args: {req: r1}}
      # 研发 Agent 起草 L3；两位客户都没说染浴 pH，而它决定是否引用「弱酸性浴」的转化对照 → 回问派给业务员 Agent 写话术
      - expect: {reply: {session: s1, contains: pH}}
      - checkpoint: 回问待答
      - send: {session: s1}
      - customer: {session: s1, text: 加点醋酸调的，pH五左右}

  - title: 5 研发改一条、确认，研发 Agent 提炼沉淀
    actions:
      - expect: {inbox: {actor: rd:R02, families: [confirm_translation]}}
      - edit: {actor: rd:R02, path: req-item, args: {req: r1, contains: 低浴比, append: ；气流缸里要随升温分段加酸，别一次加足}}
      - sign: {actor: rd:R02, action: confirm, args: {req: r1}}
      - sign: {actor: rd:R02, action: contribute, args: {req: r1}}

  - title: 6 回流：试样 → 客户评价 → 封存 / 放出 → 包装 → 发布
    actions:
      - trial: {req: r1, passed: true}
      - sign: {actor: sales:S01, action: market-eval, args: {req: r1, result: pass, note: （模拟）客户小样确认，深浅一致}}
      - checkpoint: 封存待签
      - sign: {actor: rd:R02, action: points, args: {req: r1}}
      - sign: {actor: rd:R02, action: release, args: {req: r1}}

  - title: 7 新客户在 L1 直接命中新品
    actions:
      - start: {session: s3, customer: customer:C03, sales: sales:S02}
      - customer: {session: s3, text: 锦氨布在气流缸里染，布面深一块浅一块}
      - expect: {recommend: {session: s3, product: HY-LV206}}

  - title: 支线（D17）：另一现象升级，产品经理 Agent 在 P01 的案例里找到现成产品，研发审定后业务员转述
    actions:
      - start: {session: s4, customer: customer:C04, sales: sales:S02}
      - customer: {session: s4, text: 涤纶布整理完摸起来硬邦邦的}
      - expect: {hints: {session: s4, slots: [process]}}
      - customer: {session: s4, text: 浸染的}
      - sign: {actor: sales:S02, action: escalate, args: {session: s4}, as: r4}
      - expect: {inbox: {actor: rd:R02, families: [reuse_product]}}
      - checkpoint: 支线·现成产品待审定
      - edit: {actor: rd:R02, path: reuse-note, args: {req: r4, replace: [改善, 明显改善]}}
      - sign: {actor: rd:R02, action: reuse/adopt, args: {req: r4}}
      - chat: {actor: sales:S02, session: s4, text: 研发确认了现成产品，帮我回一句告诉客户}
      - send: {session: s4}
