# 业务Agent使用同一智谱网关；实调4.1V只描述工具、不返回tool_calls，不能当工具调用备用。
# 读图仍使用models.yaml及其4.1V备用，不受此配置影响。
concurrency: 1
retry_waits: [5, 15, 30, 60]
tiers:
  fast: {base_url: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4.6v-flash", api_key_env: BACKUP_API_KEY,
         extra_body: {thinking: {type: disabled}}, price_per_1k: {input: null, output: null}, fallbacks: []}
  strong: {base_url: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4.6v-flash", api_key_env: BACKUP_API_KEY,
           extra_body: {thinking: {type: disabled}}, price_per_1k: {input: null, output: null}, fallbacks: []}
