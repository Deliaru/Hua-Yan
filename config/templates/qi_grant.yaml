id: qi_grant
family: qi_grant
kind: advance
object_type: knowledge
decision_label: 是否授予这项能力
# 同事申请；或研发反复回问、试样反复因这个条件失败、该层命中却答不了
precondition: "not attrs.granted and (attrs.requested or attrs.n_ask_back >= 2 or attrs.n_trial_missing >= 2 or attrs.n_unanswerable >= 1)"
# 打分与前置一致：前置里任一信号单独成立（回问 2 次、试样缺 2 次、答不了 1 次）都得 2/3
rule_score: "min(1, attrs.requested + (attrs.n_ask_back + attrs.n_trial_missing + 2 * attrs.n_unanswerable) / 3)"
worth_prompt: "该知识被回问 {attrs.n_ask_back} 次、该层答不了 {attrs.n_unanswerable} 次或被同事申请查看，是否由确认人授予？"
title: "{object}：是否授予？"
owner_role: rd
signer_role: rd
