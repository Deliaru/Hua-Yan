id: accept_requirement
family: accept_requirement
kind: advance
object_type: requirement
decision_label: 研发是否接单
# v8：研发「先回问客户」的条件还没答完时不提（人已批准，2026-10-21）
precondition: "attrs.status == 'draft' and attrs.reuse_checked and not attrs.reuse_pending and attrs.n_missing == 0"
