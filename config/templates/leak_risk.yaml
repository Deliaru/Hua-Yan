id: leak_risk
family: leak_risk
kind: anomaly
object_type: actor
decision_label: 是否冻结上层知识检索
# v8 Q9.8：对象只取业务员（助手的检索记到本人名下）；客户交给 mechanism_followup。窗口 7 天，从上次解冻起算
precondition: "attrs.role == 'sales' and not attrs.frozen and attrs.n_queries >= 3"
# ⑰′ 纯行为计数的暂用版；最终从三条候选里按离线变体轨迹的验证集选（REPLAN-v8 第 9 节）
rule_score: "(attrs.n_stubs_top + attrs.n_statements_top >= 3 and attrs.top_product_share >= 0.6) * 1.0"
worth_prompt: "业务员 {object} 近 7 天检索 {attrs.n_queries} 次，碰到同一产品的上层知识（只见归属）最多 {attrs.n_stubs_top} 条，读到同一产品授予给业务员的上层结论最多 {attrs.n_statements_top} 条，以上与解密申请合计 {attrs.top_product_share} 比例集中在产品 {attrs.top_product}；替 {attrs.n_decrypt_customers} 位客户申请了 {attrs.n_decrypt_products} 个产品的解密（共 {attrs.n_decrypt_requests} 次）。是否存在泄露风险、需要冻结其上层知识检索与解密申请？"
title: "{object} 的检索集中在同一产品的上层知识，是否冻结？"
owner_role: supervisor
signer_role: supervisor
urgency: "1.0"
bounty_points: 0
