id: rule_alert_leak_risk
family: leak_risk
kind: anomaly
object_type: actor
decision_label: 是否冻结上层知识检索
# 常见告警：业务员碰到同一产品的上层知识 ≥ 3 条（⑰′：只数行为，不看检索在问什么）
precondition: "attrs.role == 'sales' and not attrs.frozen and attrs.n_stubs_top >= 3"
worth_prompt: "{object} 近 7 天碰到同一产品的上层知识 {attrs.n_stubs_top} 条，是否冻结上层知识检索？"
title: "{object} 近 7 天碰到同一产品的上层知识 {attrs.n_stubs_top} 条，是否冻结上层知识检索？"
owner_role: supervisor
signer_role: supervisor
