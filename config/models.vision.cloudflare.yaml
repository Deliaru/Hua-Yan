# 仅用于 reader/image.py 的 strong 档逐页读图，Jev 仍走 ClefWorkerClient。
# 当前 Worker 无密钥校验，CLOUDFLARE_WORKER_KEY 可设为占位字符串 unused。
# 上游错误直接返回，人工处理后重跑；结构输出沿用现有网关校验。
retry_waits: []
tiers:
  strong:
    base_url: "https://jev-proxy.xi1092183542.workers.dev/v1"
    model: "@cf/meta/llama-3.2-11b-vision-instruct"
    api_key_env: CLOUDFLARE_WORKER_KEY
    # 本机 HTTP 客户端的 zstd 解压参数不兼容，按已复现问题请求未压缩响应。
    default_headers: {Accept-Encoding: identity}
    price_per_1k: {input: null, output: null}
    fallbacks: []
