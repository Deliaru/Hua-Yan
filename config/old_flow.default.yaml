# V11.2 旧流程推算参数（CEO-VIEW 4.2）。这里的数全部是**假设**，界面上逐项标「假设」；
# 传化给的参数放 data/pilot/old_flow.yaml（内部数据，不入库），同名字段覆盖这里，并标为 source 写的来源。
# 流程结构依据访谈（2026-10-08、10-10）、研究员聊天（2026-10-12）与研发提供的流程图：
# 客户 → 业务员记录 → 产品经理转述 → 研发开发 → 产品经理评价 → 业务员开单。
source: 假设
minutes:                  # 每个工位处理一件的时间（分钟）
  sales_answer: 15        # 业务员回答一个常规技术问题
  pm_answer: 30           # 业务员答不了，产品经理查资料答复
  sales_record: 20        # 业务员记录、整理客户需求
  sales_quote: 20         # 业务员报价
  pm_relay: 45            # 产品经理把需求转述成产品需求
  rd_review: 60           # 研发看单、判断做不做、用什么方向
  back_round: 60          # 补问一轮：研发 → 产品经理 → 业务员 → 客户再原路回来，几方合计
  rework: 240             # 试样失败返工一轮：研发重新调整与试样（不含等结果）
  pm_eval: 30             # 产品经理评价
  sales_order: 20         # 业务员开单
wait_hours: 4             # 每次跨岗交接的平均等待
trial_wait_hours: 72      # 一轮试样从做样到拿到结果
sales_can_answer: 0.6     # 常规技术问题业务员自己能答的比例
return_rate: 0.5          # 没有需求卡时（真实试用）：进研发的单因条件不全需要补问或返工的比例
caught_by_rd: 0.5         # 条件不全时，研发开工前发现、回头补问的比例；其余到试样失败才发现
# 三个岗位现状的时间构成（%）：本职 own，其余是被谁的事占用。从研发提供的《岗位工作范围对比（实际现状）》图上量出，
# 待确认是估计还是统计（CEO-VIEW 3.0）。sales.pm = 业务员在做产品经理的事；pm.sales / pm.rd = 产品经理被业务员 / 研发交叉占用。
time_split:
  sales: {own: 72, pm: 28}
  pm: {own: 32, sales: 40, rd: 28}
  rd: {own: 72, pm: 28}
# V11.8 CEO 面的规模与单价（CEO-VIEW 4.2 要向传化要的参数），同样全部是假设；界面上可以拖动。
monthly_inquiries: 300    # 每月客户询问量（件）
sales_people: 20          # 业务员人数
pm_people: 4              # 产品经理人数
rd_people: 8              # 研发人数
work_hours_month: 168     # 每人每月工时
sales_hour_cost: 150      # 小时人工成本（元）
pm_hour_cost: 200
rd_hour_cost: 250
trial_cost: 3000          # 一轮试样的物料与机台（元）
# 「按最保守参数」：差距往小里算——转述少丢条件、研发早发现、工位快、交接等待短、人工与试样便宜
conservative:
  minutes: {sales_record: 10, pm_relay: 20, rd_review: 30, back_round: 30, rework: 120, pm_answer: 15}
  wait_hours: 2
  trial_wait_hours: 48
  return_rate: 0.2
  caught_by_rd: 0.8
  sales_can_answer: 0.8
  sales_hour_cost: 80
  pm_hour_cost: 120
  rd_hour_cost: 150
  trial_cost: 1000
