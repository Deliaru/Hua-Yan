# v8 Q9.3：业务月里由大模型扮演的人（全部虚构，模拟数据）。
# 编制由 scripts/make_enterprise.py 生成到 data/enterprise/；这里只写人设，提示词按 id 取用。
# 客户的真实需求、试样成败由程序决定，人设只影响「怎么说、点哪个按钮」。
# every：两次查看工作台之间隔几个业务分钟（区间内按种子随机）；away：这段时间不看（做实验、开会）。
# 所有人 12:00-13:00 午休、18:00 下班；业务员在通话时不看。
# 客户多数先在自助页问化言，隔一两个小时回来看看；direct：习惯直接打给业务员。
sales:
  sales:S01: {every: [30, 60], name: 业务员小王（模拟）, customers: [customer:C01, customer:C02, customer:C03, customer:C04],
              persona: "跑了十二年市场的老业务员，客户关系熟，嫌麻烦，回问能省就省，喜欢凭经验直接给客户推荐。"}
  sales:S02: {every: [20, 40], name: 业务员小李（模拟）, customers: [customer:C05, customer:C06, customer:C07, customer:C08],
              persona: "入职一年，认真细致，按化言的提示一条条问清楚，拿不准就升级给研发。"}
  sales:S03: {every: [15, 30], name: 业务员小张（模拟）, customers: [customer:C09, customer:C10, customer:C11, customer:C12],
              persona: "能说会道，客户多、节奏快，一次只问最要紧的一两句，急着给客户答复。"}
rd:
  rd:R01: {every: [45, 90], away: ["09:30-11:00"], name: 染色过程研发陈工（模拟）, direction: 染色过程（匀染、色差、色点、色牢度）,
           persona: "谨慎，宁可先回问也不愿试样白做；签出去的判断出了问题会认真复盘。"}
  rd:R02: {every: [60, 120], away: ["14:00-16:00"], name: 弹力面料与整理研发刘工（模拟）, direction: 弹力面料与整理（手感、防皱、增白、防黄变）,
           persona: "手上单子多，嫌打扰，提示看着不要紧就点忽略；证据确凿时才动手。"}
  rd:R03: {every: [30, 60], away: ["09:30-11:00"], name: 前处理与水质研发孙工（模拟）, direction: 前处理与水质（强力损伤、螯合分散、水质）,
           persona: "新调来的研发，积极，愿意把自己的判断授予前台，也愿意按结果收窄。"}
