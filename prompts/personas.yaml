           persona: "老产品经理，看重有没有多个客户反复提，确认是真机会才合并立项。"}
  pm:P02: {every: [90, 150], name: 产品经理小吴（模拟）, line: 固色与皂洗（色牢度、沾色）,
           persona: "做事快，研发判定适用的情境基本都批，偶尔漏看条件。"}
  pm:P03: {every: [120, 180], name: 产品经理老郑（模拟）, line: 整理与前处理（手感、防皱、增白、黄变、强力）,
           persona: "稳重，批之前要看清研发依据和适用条件，条件太宽会退回。"}
